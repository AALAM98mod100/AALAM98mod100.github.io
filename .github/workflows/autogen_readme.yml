name: Autogenerate README.md
on: [push]
jobs:
  run-autogen-script:
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
    - name: Set execute permission for autogen_readme.sh
      run: chmod +x autogen_readme.sh
    - name: Run autogen_readme.sh
      run: ./autogen_readme.sh
    - name: Upload README.md as artifact
      uses: actions/upload-artifact@v4
      with:
        name: README.md
        path: README.md

  commit-changes:
    runs-on: ubuntu-latest
    needs: run-autogen-script
    steps:
    - uses: actions/checkout@v4
    - name: Download README.md artifact
      uses: actions/download-artifact@v4
      with:
        name: README.md
        path: .
    - uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "🤖 Autogenerated README.md"
        commit_options: "--no-verify"
        branch: ${{ github.ref }}
        commit_user_name: "github-actions[bot]"
        commit_user_email: "github-actions[bot]@users.noreply.github.com"
        commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
