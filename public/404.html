<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404: Page Not Found | Ammar Alam</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
            flex-direction: column;
            text-align: center;
        }
        .error-container {
            max-width: 800px;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        a {
            color: #0077cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        // Redirect to home if the URL is weird or handle SPA routes
        window.addEventListener('DOMContentLoaded', (event) => {
            // If this is a GitHub Pages 404 page but the URL looks like a valid route
            // This helps with client-side routing when refreshing the page
            const path = window.location.pathname;
            if (path !== '/' && path !== '/404.html' && !path.includes('.')) {
                // We might need to redirect to the base path
                if (path.endsWith('/')) {
                    window.location.href = '/#' + path.slice(0, -1);
                } else {
                    window.location.href = '/';
                }
            }
        });
    </script>
</head>
<body>
    <div class="error-container">
        <h1>404: Page Not Found</h1>
        <p>Sorry, we've misplaced that URL or it's pointing to something that doesn't exist.</p>
        <a href="/">Head back home</a>
    </div>
</body>
</html>
